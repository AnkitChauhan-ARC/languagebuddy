<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Buddy</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    <div class="container">
        <header>
            <h1>Language Buddy</h1>
            <p>Learn pronunciation of alphabets in different languages</p>
        </header>
        
        <div class="language-selector">
            <button class="language-btn" data-lang="english">English</button>
            <button class="language-btn" data-lang="hindi">Hindi</button>
            <button class="language-btn" data-lang="gujarati">Gujarati</button>
        </div>
        
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for a letter or word...">
        </div>
        
        <div id="english-alphabet" class="alphabet-container">
            <h2>English Alphabet</h2>
            <div class="alphabet-grid" id="english-letters"></div>
        </div>
        
        <div id="hindi-alphabet" class="alphabet-container">
            <h2>Hindi Alphabet (वर्णमाला)</h2>
            <div class="alphabet-grid" id="hindi-letters"></div>
        </div>
        
        <div id="gujarati-alphabet" class="alphabet-container">
            <h2>Gujarati Alphabet (ગુજરાતી મૂળાક્ષરો)</h2>
            <div class="alphabet-grid" id="gujarati-letters"></div>
        </div>
        
        <div class="error-message" id="error-message"></div>
        
        <div class="favorites-section">
            <h2>Your Favorites</h2>
            <div class="favorites-list" id="favorites-list"></div>
            <p class="no-favorites" id="no-favorites">You haven't added any favorites yet.</p>
        </div>
    </div>
     <script src="script.js"></script>
  
</body>
</html>
